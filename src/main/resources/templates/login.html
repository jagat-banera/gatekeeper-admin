<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: white;
            padding: 2rem;
            width: 320px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 1rem;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #0984e3;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        .success {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="login-box">

    <h2>Login</h2>

    <!-- Error message -->
    <div class="error" th:if="${param.error}">
        Invalid username or password
    </div>

    <!-- Logout success -->
    <div class="success" th:if="${param.logout}">
        You have been logged out
    </div>

    <form th:action="@{/login}" method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               required />

        <input type="password"
               name="password"
               placeholder="Password"
               required />

        <button type="submit">Login</button>

    </form>

</div>
</body>
</html>
